name: Build Script Timestamp Sync APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Generate bundled 100k+ dictionary
        run: |
          python3 -m pip install --disable-pip-version-check wordfreq
          python3 tools_generate_dictionary.py
      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace clean test assembleDebug
      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep 'package: name=' | grep 'com.futurethinking.scripttimestampsync'
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Script-Timestamp-Sync-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk